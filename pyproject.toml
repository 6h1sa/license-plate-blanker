[project]
name = "license-plate-blanker"
version = "0.1.0"
description = "写真内のナンバープレートの文字を消し、無地の板にするツール"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=1.15.0",
    "numpy>=2.4.6",
    "onnxruntime>=1.30.0",
    "opencv-python-headless>=4.13.0.92,<5",
    "pillow>=12.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 手元のサンプル写真を使う回帰チェックは時間がかかるので、明示したときだけ実行する
addopts = "-m 'not samples'"
markers = [
    "samples: sample_picture/ の実写真で結果が基準から変わっていないか確認する（uv run pytest -m samples）",
]
