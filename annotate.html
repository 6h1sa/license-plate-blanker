<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ナンバー注釈</title>
<style>
  :root { --bg: #1b1d21; --panel: #24272c; --text: #e6e6e6; --muted: #9aa0a6; --line: #34383e; --accent: #4fc3f7; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 230px 1fr 260px; background: var(--bg); color: var(--text);
         font: 13px/1.5 system-ui, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  aside { background: var(--panel); overflow: auto; border-right: 1px solid var(--line); }
  #side { border-left: 1px solid var(--line); border-right: 0; padding: 12px; }
  #list div { padding: 4px 10px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list div:hover { background: #2e3238; }
  #list div.cur { background: #34495e; }
  #list div.done::before { content: "✓ "; color: #66bb6a; }
  #list div:not(.done)::before { content: "・ "; color: var(--muted); }
  #wrap { position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  #status { position: absolute; left: 8px; top: 8px; background: #000a; padding: 4px 8px; border-radius: 4px; pointer-events: none; }
  h2 { font-size: 14px; margin: 0 0 8px; }
  .muted { color: var(--muted); }
  button { background: #2f3439; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; cursor: pointer; margin: 2px 0; width: 100%; text-align: left; }
  button:hover { background: #394047; }
  button.primary { background: #1e5d7a; border-color: #2a7aa0; }
  kbd { background: #111; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 11px; }
  #plates div { padding: 4px 6px; border-radius: 4px; cursor: pointer; }
  #plates div.sel { background: #34495e; }
  select, textarea { width: 100%; background: #1b1d21; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px; }
  .sec { margin: 12px 0; }
  .keys div { color: var(--muted); }
</style>
</head>
<body>
<aside><div id="list"></div></aside>
<div id="wrap"><canvas id="cv"></canvas><div id="status"></div></div>
<aside id="side">
  <h2 id="title">-</h2>
  <div class="muted" id="progress"></div>
  <div class="sec">
    <button class="primary" id="b-done">確定して次へ <kbd>Enter</kbd></button>
    <button id="b-add">ナンバーを追加（4隅をクリック） <kbd>A</kbd></button>
    <button id="b-fit">全体を表示 <kbd>F</kbd></button>
  </div>
  <div class="sec">
    <h2>ナンバー</h2>
    <div id="plates"></div>
  </div>
  <div class="sec" id="selbox" hidden>
    <h2>選択中のナンバー</h2>
    <label><input type="checkbox" id="ignore"> 対象外（遠すぎる・読めない・切れている） <kbd>I</kbd></label>
    <div style="margin-top:6px">種類 <kbd>K</kbd></div>
    <select id="kind">
      <option value="normal">通常</option>
      <option value="temporary">仮ナンバー・回送</option>
      <option value="other">その他（図柄・字光式など）</option>
    </select>
    <button id="b-del" style="margin-top:6px">削除 <kbd>Delete</kbd></button>
  </div>
  <div class="sec">
    <h2>メモ</h2>
    <textarea id="note" rows="2"></textarea>
  </div>
  <div class="sec keys">
    <h2>操作</h2>
    <div>ホイール: 拡大縮小</div>
    <div>空白をドラッグ: 移動</div>
    <div>角の丸をドラッグ: 四隅を修正</div>
    <div>枠の中をクリック: 選択</div>
    <div>点線の候補をクリック: 採用</div>
    <div><kbd>N</kbd>/<kbd>P</kbd>: 次・前の写真（確定はしない）</div>
    <div><kbd>Esc</kbd>: 追加を取り消し</div>
  </div>
</aside>
<script>
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const KIND_COLOR = { normal: "#4caf50", temporary: "#42a5f5", other: "#ab47bc" };
let names = [], cur = -1, ann = null, img = new Image(), dirty = false;
let view = { s: 1, ox: 0, oy: 0 }, sel = -1, adding = null, drag = null, hover = null;

const $ = (id) => document.getElementById(id);
const toScreen = ([x, y]) => [x * view.s + view.ox, y * view.s + view.oy];
const toImage = (sx, sy) => [(sx - view.ox) / view.s, (sy - view.oy) / view.s];

async function loadList() {
  names = await (await fetch("/api/list")).json();
  renderList();
}
function renderList() {
  $("list").innerHTML = "";
  names.forEach((n, i) => {
    const d = document.createElement("div");
    d.textContent = n.name;
    d.className = (n.done ? "done " : "") + (i === cur ? "cur" : "");
    d.onclick = () => open(i);
    $("list").appendChild(d);
  });
  const done = names.filter((n) => n.done).length;
  $("progress").textContent = `確定 ${done} / ${names.length} 枚`;
}

async function save(done) {
  if (!ann) return;
  if (done !== undefined) ann.done = done;
  ann.note = $("note").value;
  await fetch("/api/ann/" + encodeURIComponent(names[cur].name), { method: "POST", body: JSON.stringify(ann) });
  names[cur].done = ann.done;
  dirty = false;
  renderList();
}

async function open(i) {
  if (i < 0 || i >= names.length) return;
  if (ann && dirty) await save();
  cur = i; sel = -1; adding = null;
  $("title").textContent = names[i].name;
  $("status").textContent = "読み込み中（初回は自動検出を実行します）…";
  renderList();
  ann = await (await fetch("/api/ann/" + encodeURIComponent(names[i].name))).json();
  $("note").value = ann.note || "";
  img = new Image();
  img.onload = () => { fit(); draw(); };
  img.src = "/img/" + encodeURIComponent(names[i].name);
  renderPlates();
}

function fit() {
  const r = cv.getBoundingClientRect();
  cv.width = r.width * devicePixelRatio; cv.height = r.height * devicePixelRatio;
  const s = Math.min(cv.width / img.width, cv.height / img.height);
  view = { s, ox: (cv.width - img.width * s) / 2, oy: (cv.height - img.height * s) / 2 };
  draw();
}

function poly(q, color, width, dash) {
  ctx.beginPath();
  q.forEach((p, i) => { const [x, y] = toScreen(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.closePath();
  ctx.setLineDash(dash || []);
  ctx.strokeStyle = color; ctx.lineWidth = width * devicePixelRatio; ctx.stroke();
  ctx.setLineDash([]);
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#111"; ctx.fillRect(0, 0, cv.width, cv.height);
  if (!img.complete || !ann) return;
  ctx.imageSmoothingEnabled = view.s < 2;
  ctx.drawImage(img, view.ox, view.oy, img.width * view.s, img.height * view.s);
  (ann.suggestions || []).forEach((g) => poly(g.quad, "#bbbbbbaa", 1.5, [6, 4]));
  ann.plates.forEach((p, i) => {
    const color = p.ignore ? "#ff9800" : KIND_COLOR[p.kind] || "#4caf50";
    poly(p.quad, color, i === sel ? 2.5 : 1.5);
    if (i === sel) {
      p.quad.forEach((c, j) => {
        const [x, y] = toScreen(c);
        ctx.beginPath(); ctx.arc(x, y, 6 * devicePixelRatio, 0, 7);
        ctx.fillStyle = hover && hover.p === i && hover.c === j ? "#fff" : color + "aa"; ctx.fill();
        ctx.strokeStyle = "#000"; ctx.lineWidth = devicePixelRatio; ctx.stroke();
      });
    }
    const [lx, ly] = toScreen(p.quad[0]);
    ctx.font = `${12 * devicePixelRatio}px sans-serif`; ctx.fillStyle = color;
    ctx.fillText(`#${i + 1}${p.ignore ? " 対象外" : ""}`, lx, ly - 4 * devicePixelRatio);
  });
  if (adding) {
    adding.forEach((c) => { const [x, y] = toScreen(c); ctx.beginPath(); ctx.arc(x, y, 4 * devicePixelRatio, 0, 7); ctx.fillStyle = "#ff4081"; ctx.fill(); });
  }
  const msg = adding ? `追加中: ${adding.length}/4 点（Esc で取り消し）` : `拡大 ${(view.s / devicePixelRatio * 100).toFixed(0)}%` + (dirty ? " ・未保存" : "");
  $("status").textContent = msg;
}

function renderPlates() {
  $("plates").innerHTML = "";
  ann.plates.forEach((p, i) => {
    const d = document.createElement("div");
    const kind = { normal: "通常", temporary: "仮・回送", other: "その他" }[p.kind];
    d.textContent = `#${i + 1} ${p.ignore ? "対象外" : kind}${p.source === "auto" ? "（自動）" : ""}`;
    d.className = i === sel ? "sel" : "";
    d.onclick = () => select(i);
    $("plates").appendChild(d);
  });
  if (!ann.plates.length) $("plates").innerHTML = '<div class="muted">なし</div>';
  $("selbox").hidden = sel < 0;
  if (sel >= 0) { $("ignore").checked = ann.plates[sel].ignore; $("kind").value = ann.plates[sel].kind; }
}
function select(i) { sel = i; renderPlates(); draw(); }
function touch() { dirty = true; renderPlates(); draw(); }

function inside(q, [x, y]) {
  let c = false;
  for (let i = 0, j = 3; i < 4; j = i++) {
    const [xi, yi] = q[i], [xj, yj] = q[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c;
  }
  return c;
}
function handleAt(sx, sy) {
  if (sel < 0) return null;
  const r = 9 * devicePixelRatio;
  const q = ann.plates[sel].quad;
  for (let j = 0; j < 4; j++) { const [x, y] = toScreen(q[j]); if (Math.hypot(x - sx, y - sy) < r) return { p: sel, c: j }; }
  return null;
}
const evPos = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * devicePixelRatio, (e.clientY - r.top) * devicePixelRatio]; };

cv.addEventListener("mousedown", (e) => {
  const [sx, sy] = evPos(e), pt = toImage(sx, sy);
  if (adding) {
    adding.push(pt);
    if (adding.length === 4) {
      ann.plates.push({ quad: adding, ignore: false, kind: "normal", source: "manual" });
      adding = null; sel = ann.plates.length - 1; touch();
    }
    return draw();
  }
  const h = handleAt(sx, sy);
  if (h) { drag = { type: "corner", ...h }; return; }
  const pi = ann.plates.findIndex((p) => inside(p.quad, pt));
  if (pi >= 0) { select(pi); drag = { type: "pan", sx, sy, ox: view.ox, oy: view.oy, moved: false }; return; }
  const gi = (ann.suggestions || []).findIndex((g) => inside(g.quad, pt));
  if (gi >= 0) {
    const g = ann.suggestions.splice(gi, 1)[0];
    ann.plates.push({ quad: g.quad, ignore: false, kind: "normal", source: "suggestion" });
    sel = ann.plates.length - 1; return touch();
  }
  select(-1);
  drag = { type: "pan", sx, sy, ox: view.ox, oy: view.oy };
});
window.addEventListener("mousemove", (e) => {
  const [sx, sy] = evPos(e);
  if (drag && drag.type === "corner") {
    ann.plates[drag.p].quad[drag.c] = toImage(sx, sy); dirty = true; return draw();
  }
  if (drag && drag.type === "pan") { view.ox = drag.ox + sx - drag.sx; view.oy = drag.oy + sy - drag.sy; return draw(); }
  const h = handleAt(sx, sy);
  if (JSON.stringify(h) !== JSON.stringify(hover)) { hover = h; cv.style.cursor = h ? "move" : "crosshair"; draw(); }
});
window.addEventListener("mouseup", () => { if (drag && drag.type === "corner") renderPlates(); drag = null; });
cv.addEventListener("wheel", (e) => {
  e.preventDefault();
  const [sx, sy] = evPos(e), k = Math.exp(-e.deltaY * 0.0015);
  view.ox = sx - (sx - view.ox) * k; view.oy = sy - (sy - view.oy) * k; view.s *= k; draw();
}, { passive: false });
window.addEventListener("resize", () => { if (img.complete) { const c = [cv.width / 2, cv.height / 2]; const p = toImage(...c); const r = cv.getBoundingClientRect(); cv.width = r.width * devicePixelRatio; cv.height = r.height * devicePixelRatio; view.ox = cv.width / 2 - p[0] * view.s; view.oy = cv.height / 2 - p[1] * view.s; draw(); } });

function nextUndone() {
  for (let k = 1; k <= names.length; k++) { const i = (cur + k) % names.length; if (!names[i].done) return i; }
  return Math.min(cur + 1, names.length - 1);
}
async function confirmNext() { await save(true); open(nextUndone()); }

$("b-done").onclick = confirmNext;
$("b-add").onclick = () => { adding = []; draw(); };
$("b-fit").onclick = fit;
$("b-del").onclick = () => { if (sel >= 0) { ann.plates.splice(sel, 1); sel = -1; touch(); } };
$("ignore").onchange = (e) => { ann.plates[sel].ignore = e.target.checked; touch(); };
$("kind").onchange = (e) => { ann.plates[sel].kind = e.target.value; touch(); };
$("note").oninput = () => { dirty = true; };

window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
  const k = e.key.toLowerCase();
  if (k === "enter") { e.preventDefault(); confirmNext(); }
  else if (k === "a") { adding = []; draw(); }
  else if (k === "escape") { adding = null; draw(); }
  else if (k === "f") fit();
  else if (k === "n") open(cur + 1);
  else if (k === "p") open(cur - 1);
  else if ((k === "delete" || k === "backspace") && sel >= 0) { ann.plates.splice(sel, 1); sel = -1; touch(); }
  else if (k === "i" && sel >= 0) { ann.plates[sel].ignore = !ann.plates[sel].ignore; touch(); }
  else if (k === "k" && sel >= 0) { const ks = ["normal", "temporary", "other"]; const p = ann.plates[sel]; p.kind = ks[(ks.indexOf(p.kind) + 1) % 3]; touch(); }
});
window.addEventListener("beforeunload", () => { if (dirty) navigator.sendBeacon("/api/ann/" + encodeURIComponent(names[cur].name), JSON.stringify(ann)); });

loadList().then(() => open(Math.max(0, names.findIndex((n) => !n.done))));
</script>
</body>
</html>
